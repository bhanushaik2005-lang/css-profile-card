<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #e3f2fd;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        /* Profile Card */
        .profile-card {
            width: 350px;
            background-color: white;
            text-align: center;

            padding: 30px;
            border-radius: 15px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        /* Profile Image */
        .profile-card img {
            width: 130px;
            height: 130px;

            border-radius: 50%;
            object-fit: cover;

            border: 5px solid #2196f3;
            margin-bottom: 20px;
        }

        /* Name */
        .profile-card h1 {
            color: #222;
            font-size: 28px;
            margin-bottom: 8px;
        }

        /* Job Title */
        .profile-card h3 {
            color: #2196f3;
            font-size: 18px;
            margin-bottom: 15px;
        }

        /* Bio */
        .profile-card p {
            color: #555;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* Button */
        .profile-card button {
            background-color: #2196f3;
            color: white;

            border: none;
            padding: 12px 25px;

            font-size: 16px;
            border-radius: 8px;

            cursor: pointer;
            transition: 0.3s;
        }

        /* Button Hover Effect */
        .profile-card button:hover {
            background-color: #0d47a1;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="profile-card">

        <img src="https://via.placeholder.com/130"
             alt="Profile Image">

        <h1>S. Bhanu</h1>

        <h3>Web Developer</h3>

        <p>
            I am a passionate web development learner.
            I enjoy creating beautiful and responsive
            websites using HTML and CSS.
        </p>

        <button>Contact Me</button>

    </div>

</body>
</html>
